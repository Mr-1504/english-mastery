name: Build and Distribute

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level env: a step's own env is not available in that step's `if`.
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    defaults:
      run:
        working-directory: PracticeToeic/practicetoeicapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; keep the default package list lean.
          packages: platform-tools
          # Reuse the cmdline-tools (16.0) already present on the runner when possible.
          cmdline-tools-version: 12266719

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "GOOGLE_SERVICES_JSON_B64 secret is required" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Create local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          SUPABASE_MEDIA_BUCKET=${SUPABASE_MEDIA_BUCKET:-media}
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Determine version and release notes
        id: meta
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::This workflow only builds tags matching v* (got ${GITHUB_REF})"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          GRADLE_VERSION=$(grep -oP 'versionName\s+"\K[^"]+' PracticeToeic/practicetoeicapp/app/build.gradle | head -n1)
          if [ "$GRADLE_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag ${TAG} does not match versionName ${GRADLE_VERSION} in app/build.gradle"
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          awk -v ver="${VERSION_NAME}" '
            found && /^## / { exit }
            index($0, "## [" ver "]") == 1 { found=1; next }
            index($0, "## " ver) == 1 { found=1; next }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE" || true
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${TAG}" > "$NOTES_FILE"
          fi
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ steps.meta.outputs.version_name }}
          path: PracticeToeic/practicetoeicapp/app/build/outputs/apk/debug/app-debug.apk

      - name: Distribute to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: PracticeToeic/practicetoeicapp/app/build/outputs/apk/debug/app-debug.apk
          releaseNotesFile: ${{ steps.meta.outputs.notes_file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          files: PracticeToeic/practicetoeicapp/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
