name: Sync Issue Priority to Project

on:
  issues:
    types: [opened, edited]

permissions:
  issues: read
  repository-projects: write

jobs:
  sync-priority:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Priority from Issue Body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/### Priority\s+([^\r\n]+)/);
            if (match && match[1]) {
              core.setOutput('priority', match[1].trim());
            }

      - name: Update Project Field
        if: steps.parse.outputs.priority != ''
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/<USERNAME>/projects/<SO-PROJECT>
          github-token: ${{ secrets.PROJECT_PAT }} # Cần tạo Personal Access Token (classic) có quyền 'project'
