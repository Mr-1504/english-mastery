name: Auto-fill Priority and Current Sprint

on:
  issues:
    types: [opened, edited]

jobs:
  sync-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Priority and Sprint via GraphQL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const body = context.payload.issue.body || '';
            const priorityMatch = body.match(/### Priority\s+([^\r\n]+)/);
            const selectedPriority = priorityMatch ? priorityMatch[1].trim() : null;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          title
                          fields(first: 20) {
                            nodes {
                              ... on ProjectV2IterationField {
                                id
                                name
                                configuration {
                                  iterations { id title startDate duration }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  issueFields(first: 20) {
                    nodes {
                      ... on IssueFieldSingleSelect {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            `;

            // Đợi tối đa 15s nếu auto-add-to-project chưa kịp thêm issue vào board
            let issueNode = null;
            let issueFields = [];
            let targetItem = null;

            for (let attempt = 1; attempt <= 5; attempt++) {
              const result = await github.graphql(query, { owner, repo, number: issueNumber });
              issueNode = result.repository.issue;
              issueFields = result.repository.issueFields.nodes || [];
              targetItem = issueNode.projectItems.nodes.find(item => item.project.title === 'English Mastery');
              if (targetItem) break;
              console.log(`Lần ${attempt}: Đang đợi Issue được add vào Project...`);
              await new Promise(r => setTimeout(r, 3000));
            }

            // 1. Cập nhật Priority (Issue Field)
            if (selectedPriority && issueNode) {
              const priorityField = issueFields.find(f => f.name === 'Priority');
              if (priorityField && priorityField.options) {
                const option = priorityField.options.find(o => o.name === selectedPriority);
                if (option) {
                  await github.graphql(`
                    mutation($issueId: ID!, $fieldId: ID!, $optionId: ID!) {
                      setIssueFieldValue(input: {
                        issueId: $issueId,
                        issueFields: [
                          { fieldId: $fieldId, singleSelectOptionId: $optionId }
                        ]
                      }) {
                        issue { id }
                      }
                    }
                  `, { issueId: issueNode.id, fieldId: priorityField.id, optionId: option.id });
                  console.log('Đã gán Issue Field Priority:', selectedPriority);
                } else {
                  console.log('Không tìm thấy option trong Issue Field Priority:', selectedPriority);
                }
              } else {
                console.log('Không tìm thấy Issue Field tên Priority trên repo');
              }
            }

            if (!targetItem) {
              console.log('Không tìm thấy Project English Mastery trên Issue này.');
              return;
            }

            // 2. Tự động tìm và gán Sprint hiện tại (Project Iteration)
            const projectId = targetItem.project.id;
            const itemId = targetItem.id;
            const sprintField = targetItem.project.fields.nodes.find(f => f.name === 'Sprint');

            if (sprintField && sprintField.configuration) {
              const today = new Date();
              const currentSprint = sprintField.configuration.iterations.find(it => {
                const start = new Date(it.startDate);
                const end = new Date(start);
                end.setDate(start.getDate() + it.duration);
                return today >= start && today < end;
              });

              if (currentSprint) {
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                      value: { iterationId: $iterationId }
                    }) { projectV2Item { id } }
                  }
                `, { projectId, itemId, fieldId: sprintField.id, iterationId: currentSprint.id });
                console.log('Đã gán Sprint hiện tại:', currentSprint.title);
              }
            }