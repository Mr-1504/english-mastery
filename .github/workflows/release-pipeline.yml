name: Release Pipeline

on:
  pull_request:
    types: [closed]
    branches: [release]

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  # Needed to dispatch the Build and Distribute workflow for the new tag.
  actions: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install release tools
        run: npm install

      # Keep the tagged commit up to date with main, so the workflow file and app
      # code used by the tag build are the ones currently on main.
      - name: Sync main into release
        run: |
          git fetch origin main
          git merge --no-ff origin/main -m "chore: sync main into release"

      - name: Bump version and generate changelog
        run: npx commit-and-tag-version

      - name: Push release commit and tags
        run: git push origin HEAD:release --follow-tags

      - name: Merge release into main
        run: |
          git fetch origin main
          git checkout main
          git merge --no-ff origin/release -m "chore: merge release into main"
          git push origin main

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the tag
      # push above will not start the build by itself. workflow_dispatch is the
      # documented exception and is allowed to be triggered with GITHUB_TOKEN.
      - name: Trigger build for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "Triggering Build and Distribute for ${TAG}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run build-main.yml --ref "${TAG}"; then
              exit 0
            fi
            echo "Dispatch attempt ${attempt} failed, retrying..."
            sleep 5
          done
          echo "Could not trigger build for ${TAG}" >&2
          exit 1
