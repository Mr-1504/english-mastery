    id: priority
    attributes:
      label: Priority
      options:
        - Highest
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Mục tiêu & Yêu cầu chi tiết
      description: Mô tả rõ đầu ra (Acceptance Criteria) của task này
    validations:
      required: false