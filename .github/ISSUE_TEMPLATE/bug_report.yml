name: Bug Report
description: Báo cáo lỗi hệ thống hoặc tính năng hoạt động sai
title: "[Bug]: "
labels: ["bug"]
projects: ["Mr-1504/6"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Mức độ ưu tiên xử lý lỗi này
      options:
        - Highest
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Lỗi xảy ra ở đâu và biểu hiện như thế nào?
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện (Steps to Reproduce)
      placeholder: |
        1. Vào trang '...'
        2. Bấm vào nút '...'
        3. Lỗi xuất hiện
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi (Expected Behavior)
    validations:
      required: false